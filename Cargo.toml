[workspace]
members = ["client", "examples", "types"]
resolver = "2"

[workspace.package]
edition = "2024"
keywords = ["backpack", "exchange"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/backpack-exchange/bpx-api-client"
version = "0.22.0"

[workspace.dependencies]
anyhow = "1"
base64ct = { version = "1", features = ["alloc"] }
chrono = { default-features = false, version = "0.4", features = ["serde"] }
clap = { version = "4.5" }
dotenv = "0.15"
ed25519-dalek = "3"
futures-util = { default-features = false, version = "0.3" }
rand = "0.10"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "rustls",
] }
rust_decimal = "1"
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = "1.1.1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = ">=0.28, <0.31", features = [
    "rustls-tls-native-roots",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
wiremock = "0.6.5"

# These patches serve repository builds and CI only: they let the
# `permessage-deflate` feature compile and run in tests. Published releases
# do not carry patch sections — consumers who want the feature add the same
# two patches to their own workspace (see README).
[patch.crates-io]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
