[package]
name = "bpx-api-client"
description = "Backpack Exchange API client"
version.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[package.metadata.docs.rs]
# Not all-features: `permessage-deflate` only compiles against the patched
# tungstenite forks, which docs.rs does not have.
features = ["ws"]

[package.metadata.release]
release = true

[dependencies]
base64ct = { workspace = true }
bpx-api-types = { path = "../types", version = "0.22.0" }
ed25519-dalek = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_qs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# Optional dependencies
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[features]
default = []
ws = ["futures-util", "tokio", "tokio-tungstenite"]
# Offers RFC 7692 permessage-deflate on the WebSocket handshake (5-7x less
# wire traffic on market-data streams). Needs the forked tungstenite crates;
# see the README section "WebSocket compression".
permessage-deflate = ["ws"]
integration-tests = []

[dev-dependencies]
base64ct = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
